  /* ---------- sticky day tabs ---------- */
  .tabs-wrap{

  .tab{

    font-family:'Noto Sans TC',sans-serif;

  .tab:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .tab .today-dot{width:5px;height:5px;border-radius:50%;background:var(--red);position:absolute;top:4px;right:8px;}

  /* ---------- countdown ---------- */

  .countdown .cd-value b{color:var(--red);font-size:22px;padding:0 2px;}

  /* ---------- today badge ---------- */
  .today-badge{

    background:var(--red);color:#fff;

    animation:pulse 2s ease-in-out infinite;
  }

  /* ---------- checklist ---------- */

    border:2px solid var(--gold);border-radius:6px;background:#fff;
    cursor:pointer;position:relative;transition:background .15s ease,border-color .15s ease;
  }
  .check-item input[type="checkbox"]:checked{background:var(--gold);border-color:var(--gold);}

    border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);

  .check-item .check-text{font-size:14px;line-height:1.55;color:var(--ink);}

  .check-sub:first-child{margin-top:0;}
  .check-warn{margin:14px 0 4px;background:#fdf0e4;border-left:3px solid var(--red);border-radius:0 10px 10px 0;padding:11px 13px;font-size:13px;color:var(--ink2);line-height:1.75;}
  .check-warn b{display:block;color:var(--red);font-weight:800;margin-bottom:4px;}
